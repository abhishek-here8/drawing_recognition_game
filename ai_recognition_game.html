<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Recognition Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1a1a2e;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #1a1a2e;
    }
    .header p {
      font-size: 14px;
      color: #888780;
      margin-top: 6px;
    }

    /* ── Layout ── */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1.5rem;
      align-items: start;
    }

    /* ── Cards ── */
    .card {
      background: #ffffff;
      border: 1px solid #e0dfd8;
      border-radius: 16px;
      padding: 1.25rem;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* ── Canvas toolbar ── */
    .canvas-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tool-label {
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .color-swatches { display: flex; gap: 6px; }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { border-color: #1a1a2e; }

    .size-btns { display: flex; gap: 5px; }
    .size-btn {
      background: #f5f4f0;
      border: 1px solid #e0dfd8;
      border-radius: 7px;
      width: 30px;
      height: 30px;
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }
    .size-btn:hover { background: #e0dfd8; color: #1a1a2e; }
    .size-btn.active { background: #1a1a2e; color: #ffffff; border-color: #1a1a2e; }

    .eraser-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      background: #f5f4f0;
      border: 1px solid #e0dfd8;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: #888780;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: background 0.12s;
    }
    .eraser-btn:hover { background: #e0dfd8; color: #1a1a2e; }
    .eraser-btn.active { background: #faeeda; color: #ba7517; border-color: #ef9f27; }

    /* ── Canvas ── */
    #draw-canvas {
      display: block;
      width: 100%;
      border-radius: 10px;
      cursor: crosshair;
      touch-action: none;
      border: 1px solid #e0dfd8;
      background: #ffffff;
    }

    /* ── Action buttons ── */
    .canvas-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 11px 18px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid #e0dfd8;
    }

    .btn-clear {
      background: #f5f4f0;
      color: #5f5e5a;
    }
    .btn-clear:hover { background: #e0dfd8; color: #1a1a2e; }

    .btn-guess {
      background: #1a1a2e;
      color: #ffffff;
      border-color: #1a1a2e;
      font-weight: 600;
    }
    .btn-guess:hover { background: #2d2d4e; }
    .btn-guess:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Side panel ── */
    .side-panel { display: flex; flex-direction: column; gap: 1rem; }

    /* ── Result card ── */
    .result-card {
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .result-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #888780;
      font-size: 13px;
      text-align: center;
      padding: 1rem;
    }

    .result-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f5f4f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .guess-display { display: flex; flex-direction: column; gap: 8px; }

    .guess-main {
      font-family: 'Space Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      text-align: center;
      color: #1a1a2e;
      line-height: 1;
      padding: 12px 0;
    }

    .guess-type {
      text-align: center;
      font-size: 12px;
      color: #5f5e5a;
      padding: 4px 12px;
      background: #f5f4f0;
      border-radius: 20px;
      width: fit-content;
      margin: 0 auto;
    }

    .confidence-bar { margin-top: 6px; }
    .confidence-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888780;
      margin-bottom: 5px;
    }
    .bar-track {
      height: 6px;
      background: #f5f4f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: #1a1a2e;
      transition: width 0.7s cubic-bezier(.4,0,.2,1);
    }

    .alt-guesses { margin-top: 10px; }
    .alt-title {
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .alt-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .alt-chip {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 4px 11px;
      border-radius: 20px;
      background: #f5f4f0;
      color: #1a1a2e;
      border: 1px solid #e0dfd8;
    }

    .feedback-row {
      margin-top: 10px;
      border-top: 1px solid #f0efe8;
      padding-top: 10px;
    }
    .feedback-label { font-size: 12px; color: #888780; margin-bottom: 7px; }
    .feedback-btns { display: flex; gap: 6px; }
    .fb-btn {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: opacity 0.12s;
      border: 1px solid;
    }
    .fb-btn:disabled { opacity: 0.5; cursor: default; }
    .fb-yes { background: #eaf3de; color: #3b6d11; border-color: #639922; }
    .fb-no  { background: #fcebeb; color: #a32d2d; border-color: #e24b4a; }

    /* ── Loading ── */
    .loading-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid #e0dfd8;
      border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: #888780; }

    /* ── Error ── */
    .error-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #a32d2d;
      font-size: 13px;
      text-align: center;
      padding: 1rem;
    }

    /* ── Stats card ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #f5f4f0;
      border-radius: 9px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.2;
    }
    .stat-num.green { color: #3b6d11; }
    .stat-num.amber { color: #ba7517; }
    .stat-name {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 2px;
    }

    /* ── Hint card ── */
    .hint-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .hint-tag {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e0dfd8;
      color: #5f5e5a;
      cursor: pointer;
      transition: all 0.12s;
      background: #f5f4f0;
    }
    .hint-tag:hover {
      background: #1a1a2e;
      color: #ffffff;
      border-color: #1a1a2e;
    }



    /* ── Responsive ── */
    @media (max-width: 680px) {
      .game-layout { grid-template-columns: 1fr; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>AI Recognition Game</h1>
    <p>Draw a letter, digit, or symbol — the AI will guess what it is</p>
  </div>

  <div class="game-layout">

    <!-- Left: Canvas -->
    <div class="card">
      <div class="canvas-toolbar">
        <span class="tool-label">Color</span>
        <div class="color-swatches">
          <div class="swatch active" style="background:#1a1a2e" data-color="#1a1a2e"></div>
          <div class="swatch" style="background:#D85A30" data-color="#D85A30"></div>
          <div class="swatch" style="background:#1D9E75" data-color="#1D9E75"></div>
          <div class="swatch" style="background:#7F77DD" data-color="#7F77DD"></div>
          <div class="swatch" style="background:#E24B4A" data-color="#E24B4A"></div>
        </div>
        <div class="size-btns">
          <button class="size-btn" data-size="4">S</button>
          <button class="size-btn active" data-size="8">M</button>
          <button class="size-btn" data-size="16">L</button>
        </div>
        <button class="eraser-btn" id="eraser-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 20H7L3 16l10-10 7 7-1.5 1.5"/>
            <path d="m6.5 17.5 5-5"/>
          </svg>
          Eraser
        </button>
      </div>

      <canvas id="draw-canvas" width="560" height="340"></canvas>

      <div class="canvas-actions">
        <button class="btn btn-clear" id="clear-btn">Clear Canvas</button>
        <button class="btn btn-guess" id="guess-btn">Ask AI to Guess →</button>
      </div>
    </div>

    <!-- Right: Side Panel -->
    <div class="side-panel">

      <!-- Result Card -->
      <div class="card result-card" id="result-card">
        <div class="card-label">AI Guess</div>
        <div class="result-empty">
          <div class="result-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v4l3 3"/>
            </svg>
          </div>
          Draw something then press "Ask AI to Guess"
        </div>
      </div>

      <!-- Stats Card -->
      <div class="card">
        <div class="card-label">Score</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-name">Guesses</div>
          </div>
          <div class="stat-box">
            <div class="stat-num green" id="stat-correct">0</div>
            <div class="stat-name">Correct</div>
          </div>
          <div class="stat-box">
            <div class="stat-num amber" id="stat-streak">0</div>
            <div class="stat-name">Streak</div>
          </div>
        </div>
      </div>

      <!-- Quick Draw Card -->
      <div class="card">
        <div class="card-label">Quick Draw — click to auto-draw</div>
        <div class="hint-tags" id="hint-tags"></div>
      </div>

    </div>
  </div>
</div>

<script>
  /* ─────────────────────────────────────────────
     Canvas setup
  ───────────────────────────────────────────── */
  const canvas = document.getElementById('draw-canvas');
  const ctx    = canvas.getContext('2d');
  let drawing      = false;
  let currentColor = '#1a1a2e';
  let currentSize  = 8;
  let erasing      = false;
  let hasDrawing   = false;
  let stats = { total: 0, correct: 0, streak: 0 };

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top)  * scaleY
    };
  }

  canvas.addEventListener('mousedown', e => {
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    hasDrawing = true;
  });

  canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineWidth  = erasing ? 36 : currentSize;
    ctx.strokeStyle = erasing ? '#ffffff' : currentColor;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });

  canvas.addEventListener('mouseup',    () => { drawing = false; ctx.beginPath(); });
  canvas.addEventListener('mouseleave', () => { drawing = false; ctx.beginPath(); });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    hasDrawing = true;
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineWidth   = erasing ? 36 : currentSize;
    ctx.strokeStyle = erasing ? '#ffffff' : currentColor;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }, { passive: false });

  canvas.addEventListener('touchend', () => { drawing = false; ctx.beginPath(); });

  /* ─────────────────────────────────────────────
     Toolbar controls
  ───────────────────────────────────────────── */
  document.querySelectorAll('.swatch').forEach(s => {
    s.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      currentColor = s.dataset.color;
      erasing = false;
      document.getElementById('eraser-btn').classList.remove('active');
    });
  });

  document.querySelectorAll('.size-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentSize = parseInt(b.dataset.size);
    });
  });

  document.getElementById('eraser-btn').addEventListener('click', () => {
    erasing = !erasing;
    document.getElementById('eraser-btn').classList.toggle('active', erasing);
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawing = false;
    showEmpty();
  });

  /* ─────────────────────────────────────────────
     Quick Draw hints
  ───────────────────────────────────────────── */
  const hints = ['A','B','Z','a','b','z','0','1','9','@','#','$','%','&','!','?','+','=','*','~'];
  const hintsEl = document.getElementById('hint-tags');

  hints.forEach(h => {
    const tag = document.createElement('div');
    tag.className = 'hint-tag';
    tag.textContent = h;
    tag.title = `Auto-draw "${h}"`;
    tag.addEventListener('click', () => drawHintChar(h));
    hintsEl.appendChild(tag);
  });

  function drawHintChar(ch) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font          = `bold ${canvas.height * 0.6}px Outfit, sans-serif`;
    ctx.fillStyle     = currentColor;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'middle';
    ctx.fillText(ch, canvas.width / 2, canvas.height / 2);
    hasDrawing = true;
  }

  /* ─────────────────────────────────────────────
     Result card states
  ───────────────────────────────────────────── */
  function showEmpty() {
    const card = document.getElementById('result-card');
    card.innerHTML = `
      <div class="card-label">AI Guess</div>
      <div class="result-empty">
        <div class="result-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
          </svg>
        </div>
        Draw something then press "Ask AI to Guess"
      </div>`;
  }

  function showLoading() {
    const card = document.getElementById('result-card');
    card.innerHTML = `
      <div class="card-label">AI Guess</div>
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Analyzing your drawing...</div>
      </div>`;
  }

  function showError(msg) {
    const card = document.getElementById('result-card');
    card.innerHTML = `
      <div class="card-label">AI Guess</div>
      <div class="error-state">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        ${msg}
      </div>`;
  }

  function showResult(data) {
    const card    = document.getElementById('result-card');
    const confPct = Math.round((data.confidence || 0.8) * 100);

    const altHtml = data.alternatives && data.alternatives.length
      ? `<div class="alt-guesses">
           <div class="alt-title">Also possible</div>
           <div class="alt-list">${data.alternatives.map(a => `<div class="alt-chip">${a}</div>`).join('')}</div>
         </div>`
      : '';

    const descHtml = data.description
      ? `<div style="font-size:12px;color:#888780;margin-top:6px;font-style:italic;">${data.description}</div>`
      : '';

    card.innerHTML = `
      <div class="card-label">AI Guess</div>
      <div class="guess-display">
        <div class="guess-main">${data.character}</div>
        <div class="guess-type">${data.type}</div>
        <div class="confidence-bar">
          <div class="confidence-label">
            <span>Confidence</span><span>${confPct}%</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:0%" id="conf-bar"></div></div>
        </div>
        ${altHtml}
        ${descHtml}
        <div class="feedback-row">
          <div class="feedback-label">Was the AI correct?</div>
          <div class="feedback-btns">
            <button class="fb-btn fb-yes" id="fb-yes">Yes!</button>
            <button class="fb-btn fb-no"  id="fb-no">Nope</button>
          </div>
        </div>
      </div>`;

    setTimeout(() => {
      const bar = document.getElementById('conf-bar');
      if (bar) bar.style.width = confPct + '%';
    }, 80);

    document.getElementById('fb-yes').addEventListener('click', () => {
      stats.total++;
      stats.correct++;
      stats.streak++;
      updateStats();
      document.getElementById('fb-yes').textContent = 'Marked ✓';
      document.getElementById('fb-yes').disabled = true;
      document.getElementById('fb-no').disabled  = true;
    });

    document.getElementById('fb-no').addEventListener('click', () => {
      stats.total++;
      stats.streak = 0;
      updateStats();
      document.getElementById('fb-no').textContent  = 'Noted!';
      document.getElementById('fb-yes').disabled = true;
      document.getElementById('fb-no').disabled  = true;
    });
  }

  function updateStats() {
    document.getElementById('stat-total').textContent   = stats.total;
    document.getElementById('stat-correct').textContent = stats.correct;
    document.getElementById('stat-streak').textContent  = stats.streak;
  }

  /* ─────────────────────────────────────────────
     AI Guess — calls Anthropic API
  ───────────────────────────────────────────── */
  document.getElementById('guess-btn').addEventListener('click', async () => {
    if (!hasDrawing) {
      showError('Please draw something first!');
      return;
    }

    const btn = document.getElementById('guess-btn');
    btn.disabled = true;
    showLoading();

    const imageData = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

    const prompt = `You are an expert AI that analyzes hand-drawn images and identifies what single character was drawn.

The drawing may be:
- A digit: 0-9
- An uppercase letter: A-Z
- A lowercase letter: a-z
- A special character or symbol: @, #, $, %, &, !, ?, +, =, *, ~, etc.

Look carefully at the shape, strokes, and proportions. Respond ONLY with a valid JSON object — no markdown, no backticks, no extra text:
{
  "character": "the single character drawn",
  "type": "Digit | Uppercase Letter | Lowercase Letter | Symbol",
  "confidence": 0.0 to 1.0,
  "alternatives": ["up to 3 other plausible characters"],
  "description": "one sentence describing what you see in the drawing"
}`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
